<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store admin | Nutikals</title>
  <style>
    :root{color-scheme:light;--ink:#243126;--muted:#68736a;--line:#dce3dc;--paper:#f5f7f3;--green:#244c36;--danger:#9c3027}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:18px max(24px,calc((100vw - 1080px)/2));display:flex;justify-content:space-between;align-items:center}header a{color:var(--green)}main{max-width:1080px;margin:38px auto;padding:0 24px}h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px}h2{font-size:22px;margin:0 0 18px}.muted{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;margin:24px 0;box-shadow:0 8px 30px #1935220a}.login{max-width:460px;margin:54px auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-weight:650;font-size:14px}input,textarea{width:100%;border:1px solid #bdc9be;border-radius:8px;padding:11px 12px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:120px;resize:vertical}button{font:inherit;font-weight:650;border:0;border-radius:8px;padding:11px 16px;background:var(--green);color:white;cursor:pointer}button.secondary{background:#edf2ed;color:var(--ink)}button.danger{background:#fff1ef;color:var(--danger)}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}.message{min-height:24px;margin:12px 0 0}.message.error{color:var(--danger)}.product{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:16px;align-items:center;border-top:1px solid var(--line);padding:14px 0}.product img{width:74px;height:74px;object-fit:cover;border-radius:8px;background:#edf2ed}.product h3{margin:0 0 3px;font-size:17px}.product p{margin:0;color:var(--muted);font-size:14px}.product-actions{display:flex;gap:8px}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px}.help{font-size:13px;color:var(--muted)}@media(max-width:650px){main{margin:24px auto;padding:0 16px}.panel{padding:18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.product{grid-template-columns:58px minmax(0,1fr)}.product img{width:58px;height:58px}.product-actions{grid-column:2}.topline{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header><strong>Nutikals · Store admin</strong><a href="/">View storefront</a></header>
  <main>
    <section id="login" class="panel login">
      <h1>Admin sign in</h1>
      <p class="muted">Use the admin username and password configured on the server.</p>
      <form id="login-form" class="grid">
        <div class="field full"><label for="username">Username</label><input id="username" autocomplete="username" required></div>
        <div class="field full"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <div class="field full"><button>Sign in</button></div>
      </form><p id="login-message" class="message" role="status"></p>
    </section>
    <section id="dashboard" class="hidden">
      <div class="topline"><div><h1>Products</h1><p class="muted">Create and update products in your PostgreSQL catalog.</p></div><button id="sign-out" class="secondary">Sign out</button></div>
      <section class="panel">
        <h2 id="form-title">Add a product</h2>
        <form id="product-form">
          <div class="grid">
            <div class="field"><label for="product-id">ID</label><input id="product-id" name="id" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="e.g. s9" required></div>
            <div class="field"><label for="product-name">Name</label><input id="product-name" name="name" maxlength="160" required></div>
            <div class="field"><label for="product-price">Price (Rs.)</label><input id="product-price" name="price" type="number" min="0.01" step="0.01" required></div>
            <div class="field"><label for="product-image">Image URL or path</label><input id="product-image" name="image_url" maxlength="1000" placeholder="/images/product.jpg" required></div>
            <div class="field full"><label for="product-description">Description</label><textarea id="product-description" name="description" maxlength="5000" required></textarea></div>
          </div>
          <div class="actions"><button id="save-product">Save product</button><button id="cancel-edit" type="button" class="secondary hidden">Cancel edit</button><span id="form-message" class="help" role="status"></span></div>
        </form>
      </section>
      <section class="panel"><div class="topline"><h2>Current catalog</h2><button id="refresh" class="secondary">Refresh</button></div><div id="product-list" class="muted">Loading…</div><p id="list-message" class="message" role="status"></p></section>
    </section>
  </main>
  <script>
    const login = document.querySelector("#login");
    const dashboard = document.querySelector("#dashboard");
    const loginForm = document.querySelector("#login-form");
    const loginMessage = document.querySelector("#login-message");
    const productForm = document.querySelector("#product-form");
    const productList = document.querySelector("#product-list");
    let authHeader = "";
    let editingId = null;
    let products = [];
    const basic = value => "Basic " + btoa(unescape(encodeURIComponent(value)));
    async function api(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { "Content-Type": "application/json", Authorization: authHeader, ...(options.headers || {}) } });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "Request failed.");
      return result;
    }
    function message(target, text, isError = false) { target.textContent = text; target.classList.toggle("error", isError); }
    function drawProducts() {
      if (!products.length) { productList.textContent = "No products yet. Add your first product above."; return; }
      productList.replaceChildren(...products.map(product => {
        const row = document.createElement("article"); row.className = "product";
        const image = document.createElement("img"); image.src = product.image_url; image.alt = ""; image.onerror = () => image.hidden = true;
        const copy = document.createElement("div");
        const title = document.createElement("h3"); title.textContent = `${product.name} · Rs. ${Number(product.price).toLocaleString("en-PK")}`;
        const detail = document.createElement("p"); detail.textContent = `${product.id} · ${product.image_url}`;
        copy.append(title, detail);
        const actions = document.createElement("div"); actions.className = "product-actions";
        const edit = document.createElement("button"); edit.className = "secondary"; edit.textContent = "Edit"; edit.onclick = () => startEdit(product);
        const remove = document.createElement("button"); remove.className = "danger"; remove.textContent = "Delete"; remove.onclick = () => deleteProduct(product.id);
        actions.append(edit, remove); row.append(image, copy, actions); return row;
      }));
    }
    async function refreshProducts() {
      productList.textContent = "Loading…";
      try { products = await api("/api/admin/products"); drawProducts(); message(document.querySelector("#list-message"), ""); }
      catch (error) { message(document.querySelector("#list-message"), error.message, true); }
    }
    function startEdit(product) {
      editingId = product.id;
      for (const field of productForm.elements) if (field.name) field.value = product[field.name] ?? "";
      document.querySelector("#product-id").disabled = true;
      document.querySelector("#form-title").textContent = `Edit ${product.name}`;
      document.querySelector("#save-product").textContent = "Save changes";
      document.querySelector("#cancel-edit").classList.remove("hidden");
      message(document.querySelector("#form-message"), "");
      productForm.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    function resetForm() {
      editingId = null; productForm.reset(); document.querySelector("#product-id").disabled = false;
      document.querySelector("#form-title").textContent = "Add a product";
      document.querySelector("#save-product").textContent = "Save product";
      document.querySelector("#cancel-edit").classList.add("hidden");
    }
    async function deleteProduct(id) {
      if (!confirm(`Delete ${id}? This removes it from the storefront.`)) return;
      try { await api(`/api/admin/products/${encodeURIComponent(id)}`, { method: "DELETE" }); await refreshProducts(); }
      catch (error) { message(document.querySelector("#list-message"), error.message, true); }
    }
    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      authHeader = basic(`${document.querySelector("#username").value}:${document.querySelector("#password").value}`);
      try {
        await api("/api/admin/products");
        login.classList.add("hidden"); dashboard.classList.remove("hidden");
        document.querySelector("#password").value = ""; await refreshProducts();
      } catch (error) { authHeader = ""; message(loginMessage, error.message, true); }
    });
    productForm.addEventListener("submit", async event => {
      event.preventDefault(); const values = Object.fromEntries(new FormData(productForm));
      const button = document.querySelector("#save-product"); button.disabled = true;
      try {
        await api(editingId ? `/api/admin/products/${encodeURIComponent(editingId)}` : "/api/admin/products", { method: editingId ? "PUT" : "POST", body: JSON.stringify(values) });
        resetForm(); await refreshProducts(); message(document.querySelector("#form-message"), "Product saved.");
      } catch (error) { message(document.querySelector("#form-message"), error.message, true); }
      finally { button.disabled = false; }
    });
    document.querySelector("#cancel-edit").onclick = resetForm;
    document.querySelector("#refresh").onclick = refreshProducts;
    document.querySelector("#sign-out").onclick = () => { authHeader = ""; products = []; dashboard.classList.add("hidden"); login.classList.remove("hidden"); loginForm.reset(); message(loginMessage, ""); };
  </script>
</body>
</html>
